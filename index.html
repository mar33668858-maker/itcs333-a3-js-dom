<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ITCS333 A3 — To-Do</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>

    <form id="todo-form" novalidate>
      <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
      <button type="submit" id="add-btn">Add</button>
    </form>
    <p id="error-msg" class="hidden">Please enter a task.</p>

    <div class="filters">
      <button type="button" id="filter-all">All</button>
      <button type="button" id="filter-active">Active</button>
      <button type="button" id="filter-done">Done</button>
    </div>

    <ul id="todo-list"></ul>

    <p id="counter">0 items left</p>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
